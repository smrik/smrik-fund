name: Free research contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv
      - run: uv sync --frozen
      - run: uv run pytest -q tests/test_analysis_budget.py tests/test_company_case.py tests/test_company_history.py tests/test_company_operating.py tests/test_company_research.py tests/test_workbook_template.py tests/test_daily_research.py tests/test_research_workspace.py tests/test_research_watchlist.py
