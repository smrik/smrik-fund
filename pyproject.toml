[project]
name = "smrik-fund"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "smrik" }
]
requires-python = ">=3.13"
dependencies = [
    "edgartools>=5.45.1",
    "pandas>=3.0.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "typer>=0.27.1",
]

[project.scripts]
smrik-fund = "smrik_fund.main:app"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.1",
]

[tool.ruff.lint]
extend-select = ["I"]
